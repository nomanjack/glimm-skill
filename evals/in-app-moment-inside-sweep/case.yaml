schema_version: "1.1"
name: in-app-moment-inside-sweep
expected_outcome: |
  A plan upgrade in a Next.js app gets a glimm sweep without any route change.
  It may use GlimmScope, or GlimmProvider in the root layout with sweep() from
  useGlimm. The button shows its loading state straight away. With sweep(), the
  request is awaited first and the state update runs inside the sweep callback.
  With GlimmScope, the request goes in work, which rejects on a failed response,
  and the state update goes in change. Everything that belongs to the result,
  including the Pro badge, changes with the sweep. No delay is added to line the
  change up with the band or to hold the button until the sweep ends. A failed
  response gets no sweep, and no invented API is used. The change stays limited
  to glimm, with no new error messages, copy or other product changes.
